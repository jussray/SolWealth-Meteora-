name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove exact checked-out head
        run: |
          echo "tested_sha=$(git rev-parse HEAD)"
      - name: Test
        run: npm test
      - name: Run end-to-end birth demo
        run: npm run demo | tee solwealth-birth-receipt.json
      - name: Fail closed if demo claims live effects
        run: |
          grep -q '"realMoney": false' solwealth-birth-receipt.json
          grep -q '"transactionSigned": false' solwealth-birth-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-birth-receipt.json
          grep -q '"memoryVerified": true' solwealth-birth-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: solwealth-birth-receipt
          path: solwealth-birth-receipt.json
