name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind proof to exact head
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"
      - name: Test
        run: npm test
      - name: Run end-to-end birth demo
        run: |
          set -o pipefail
          npm run demo | tee solwealth-birth-receipt.json
      - name: Fail closed if demo claims live effects
        run: |
          grep -q '"realMoney": false' solwealth-birth-receipt.json
          grep -q '"transactionSigned": false' solwealth-birth-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-birth-receipt.json
          grep -q '"memoryVerified": true' solwealth-birth-receipt.json
          grep -q '"mindCanSelfAuthorize": false' solwealth-birth-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: solwealth-birth-receipt
          path: solwealth-birth-receipt.json

  live-devnet-crawler:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SOLANA_DEVNET_RPC_URLS: https://api.devnet.solana.com,https://rpc.ankr.com/solana_devnet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind live proof to exact head
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"
      - name: Run bounded two-provider Devnet crawler
        run: |
          set -o pipefail
          npm run crawler:live | tee solwealth-crawler-receipt.json
      - name: Verify two-eye crawler truth and boundaries
        run: |
          grep -q '"clusterVerified": true' solwealth-crawler-receipt.json
          grep -q '"programPresent": true' solwealth-crawler-receipt.json
          grep -q '"programExecutable": true' solwealth-crawler-receipt.json
          grep -q '"observedProviderCount": 2' solwealth-crawler-receipt.json
          grep -q '"liveWitness": "VERIFIED"' solwealth-crawler-receipt.json
          grep -q '"experienceStatus": "EXPERIENCED_VERIFIED"' solwealth-crawler-receipt.json
          grep -q '"simulationWitness": "VERIFIED"' solwealth-crawler-receipt.json
          grep -q '"verifiedExperiences": 1' solwealth-crawler-receipt.json
          grep -q '"recommendedStage": "crawler"' solwealth-crawler-receipt.json
          grep -q '"memoryVerified": true' solwealth-crawler-receipt.json
          grep -q '"realMoney": false' solwealth-crawler-receipt.json
          grep -q '"transactionSigned": false' solwealth-crawler-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-crawler-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solwealth-crawler-receipt
          path: solwealth-crawler-receipt.json
          if-no-files-found: warn
