name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind proof to exact head
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"
      - name: Test
        run: npm test
      - name: Run end-to-end birth demo
        run: |
          set -o pipefail
          npm run demo | tee solwealth-birth-receipt.json
      - name: Fail closed if demo claims live effects
        run: |
          grep -q '"realMoney": false' solwealth-birth-receipt.json
          grep -q '"transactionSigned": false' solwealth-birth-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-birth-receipt.json
          grep -q '"memoryVerified": true' solwealth-birth-receipt.json
          grep -q '"mindCanSelfAuthorize": false' solwealth-birth-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: solwealth-birth-receipt
          path: solwealth-birth-receipt.json

  persistent-memory:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind persistence proof to exact head
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"
      - name: Prove cross-process memory restart
        run: |
          set -o pipefail
          npm run memory:restart | tee solwealth-memory-restart-receipt.json
      - name: Verify memory continuity without authority continuity
        run: |
          grep -q '"memorySurvivedRestart": true' solwealth-memory-restart-receipt.json
          grep -q '"verifiedExperiencesRestored": 1' solwealth-memory-restart-receipt.json
          grep -q '"recommendedStage": "crawler"' solwealth-memory-restart-receipt.json
          grep -q '"authorityRestored": false' solwealth-memory-restart-receipt.json
          grep -q '"pendingProposalsRestored": false' solwealth-memory-restart-receipt.json
          grep -q '"pendingApprovalsRestored": false' solwealth-memory-restart-receipt.json
          grep -q '"memoryVerified": true' solwealth-memory-restart-receipt.json
          grep -q '"realMoney": false' solwealth-memory-restart-receipt.json
          grep -q '"transactionSigned": false' solwealth-memory-restart-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-memory-restart-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: solwealth-memory-restart-receipt
          path: solwealth-memory-restart-receipt.json

  live-devnet-crawler:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SOLANA_DEVNET_RPC_URLS: https://api.devnet.solana.com,https://solana-devnet.api.onfinality.io/public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind live proof to exact head
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"
      - name: Run bounded two-provider Devnet crawler
        run: |
          set -o pipefail
          npm run crawler:live | tee solwealth-crawler-receipt.json
      - name: Verify two-eye crawler truth and boundaries
        run: |
          grep -q '"clusterVerified": true' solwealth-crawler-receipt.json
          grep -q '"programPresent": true' solwealth-crawler-receipt.json
          grep -q '"programExecutable": true' solwealth-crawler-receipt.json
          grep -q '"observedProviderCount": 2' solwealth-crawler-receipt.json
          grep -q '"liveWitness": "VERIFIED"' solwealth-crawler-receipt.json
          grep -Eq '"observationFingerprint": "[0-9a-f]{64}"' solwealth-crawler-receipt.json
          grep -q '"noveltyClass": "BASELINE"' solwealth-crawler-receipt.json
          grep -q '"cognitionSource": "deterministic"' solwealth-crawler-receipt.json
          grep -q '"cognitionCanSelfAuthorize": false' solwealth-crawler-receipt.json
          grep -q '"experienceStatus": "EXPERIENCED_VERIFIED"' solwealth-crawler-receipt.json
          grep -Eq '"experienceFingerprint": "xfp_[0-9a-f]{20}"' solwealth-crawler-receipt.json
          grep -q '"simulationWitness": "VERIFIED"' solwealth-crawler-receipt.json
          grep -q '"verifiedExperiences": 1' solwealth-crawler-receipt.json
          grep -q '"recommendedStage": "crawler"' solwealth-crawler-receipt.json
          grep -q '"memoryVerified": true' solwealth-crawler-receipt.json
          grep -q '"realMoney": false' solwealth-crawler-receipt.json
          grep -q '"transactionSigned": false' solwealth-crawler-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-crawler-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solwealth-crawler-receipt
          path: solwealth-crawler-receipt.json
          if-no-files-found: warn

  live-dbc-account-discovery:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SOLANA_DEVNET_RPC_URLS: https://api.devnet.solana.com,https://solana-devnet.api.onfinality.io/public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind live account proof to exact head
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"
      - name: Discover and independently verify live DBC accounts
        run: |
          set -o pipefail
          npm run accounts:live | tee solwealth-dbc-account-receipt.json
      - name: Verify discovery quorum and two-provider identity evidence
        run: |
          grep -q '"status": "OBSERVED"' solwealth-dbc-account-receipt.json
          grep -q '"configDiscoveryStatus": "VERIFIED"' solwealth-dbc-account-receipt.json
          grep -q '"poolDiscoveryStatus": "VERIFIED"' solwealth-dbc-account-receipt.json
          grep -q '"configDiscoveryAgreeingProviders": 2' solwealth-dbc-account-receipt.json
          grep -q '"poolDiscoveryAgreeingProviders": 2' solwealth-dbc-account-receipt.json
          grep -q '"configDiscoveryProviderAgreementVerified": true' solwealth-dbc-account-receipt.json
          grep -q '"poolDiscoveryProviderAgreementVerified": true' solwealth-dbc-account-receipt.json
          grep -q '"configCandidateSelectionIsEvidence": false' solwealth-dbc-account-receipt.json
          grep -q '"poolCandidateSelectionIsEvidence": false' solwealth-dbc-account-receipt.json
          grep -q '"clusterVerified": true' solwealth-dbc-account-receipt.json
          grep -q '"programPresent": true' solwealth-dbc-account-receipt.json
          grep -q '"programExecutable": true' solwealth-dbc-account-receipt.json
          grep -q '"liveWitness": "VERIFIED"' solwealth-dbc-account-receipt.json
          grep -q '"configPresent": true' solwealth-dbc-account-receipt.json
          grep -q '"configOwnedByDbcProgram": true' solwealth-dbc-account-receipt.json
          grep -q '"configAccountTypeMatches": true' solwealth-dbc-account-receipt.json
          grep -q '"configWitness": "VERIFIED"' solwealth-dbc-account-receipt.json
          grep -q '"poolPresent": true' solwealth-dbc-account-receipt.json
          grep -q '"poolOwnedByDbcProgram": true' solwealth-dbc-account-receipt.json
          grep -q '"poolAccountTypeMatches": true' solwealth-dbc-account-receipt.json
          grep -q '"poolWitness": "VERIFIED"' solwealth-dbc-account-receipt.json
          grep -q '"orientationDisposition": "LEARN"' solwealth-dbc-account-receipt.json
          grep -q '"memoryVerified": true' solwealth-dbc-account-receipt.json
          grep -q '"authorityChanged": false' solwealth-dbc-account-receipt.json
          grep -q '"realMoney": false' solwealth-dbc-account-receipt.json
          grep -q '"transactionSigned": false' solwealth-dbc-account-receipt.json
          grep -q '"transactionSubmitted": false' solwealth-dbc-account-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solwealth-dbc-account-receipt
          path: solwealth-dbc-account-receipt.json
          if-no-files-found: warn
